name: RAG System Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov requests locust

    - name: Start backend server
      run: |
        # Start backend in background
        python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
        echo $! > backend.pid
        
        # Wait for backend to start (max 30 seconds)
        echo "Waiting for backend to start..."
        for i in {1..30}; do
          if curl -f http://localhost:8000/health > /dev/null 2>&1; then
            echo "✅ Backend is ready!"
            break
          fi
          echo "⏳ Waiting... ($i/30)"
          sleep 1
        done
      continue-on-error: false

    - name: Seed database with test data
      run: |
        python seed_database.py || true

    - name: Run API tests with pytest
      run: |
        pytest test_with_data.py -v --tb=short

    - name: Generate test report
      if: always()
      run: |
        pytest test_with_data.py --html=report.html --self-contained-html || true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: report.html

    - name: Upload backend logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: backend-logs-${{ matrix.python-version }}
        path: backend.log

    - name: Stop backend
      if: always()
      run: |
        if [ -f backend.pid ]; then
          kill $(cat backend.pid) || true
        fi

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run Bandit security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json || true

    - name: Upload security report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: bandit-report.json

  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov coverage

    - name: Start backend server
      run: |
        # Start backend in background
        python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
        echo $! > backend.pid
        
        # Wait for backend to start (max 30 seconds)
        echo "Waiting for backend to start..."
        for i in {1..30}; do
          if curl -f http://localhost:8000/health > /dev/null 2>&1; then
            echo "✅ Backend is ready!"
            break
          fi
          echo "⏳ Waiting... ($i/30)"
          sleep 1
        done
      continue-on-error: false

    - name: Seed database with test data
      run: |
        python seed_database.py || true

    - name: Run coverage
      run: |
        pytest test_with_data.py --cov=src --cov-report=xml --cov-report=html

    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: htmlcov/

    - name: Stop backend
      if: always()
      run: |
        if [ -f backend.pid ]; then
          kill $(cat backend.pid) || true
        fi